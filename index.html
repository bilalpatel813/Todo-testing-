<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="description" content="A simple task list to organize your work.">
  <title>To-Do List</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="todo-app" id="todo-app">
    <header class="todo-header">
      <p class="todo-eyebrow">STAY ORGANIZED</p>
      <h1 class="todo-title">My tasks</h1>
      <p class="todo-description">Keep track of what you need to get done.</p>
    </header>

    <section class="todo-entry" aria-labelledby="add-task-heading">
      <h2 class="section-title" id="add-task-heading">Add a task</h2>
      <form class="task-form" id="task-form" novalidate>
        <label class="visually-hidden" for="task-title">Task title</label>
        <input
          class="task-input"
          id="task-title"
          name="title"
          type="text"
          placeholder="What needs to be done?"
          maxlength="200"
          autocomplete="off"
          aria-describedby="task-title-help task-title-error"
          required
        >
        <button class="add-task-button" id="add-task-button" type="submit" aria-label="Add task">
          <span aria-hidden="true">+</span>
          <span>Add task</span>
        </button>
        <p class="field-help" id="task-title-help">Enter a task title to add it to your list.</p>
        <p class="field-error" id="task-title-error" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section class="task-section" aria-labelledby="task-list-heading">
      <div class="task-section-heading">
        <h2 class="section-title" id="task-list-heading">Your list</h2>
        <span class="task-count" id="task-count" aria-live="polite">0 tasks</span>
      </div>

      <p class="empty-state" id="empty-state">No tasks yet. Add your first task above.</p>
      <ul class="task-list" id="task-list" aria-label="Tasks">
        <!-- Task items are created from the template by script.js. -->
      </ul>
    </section>
  </main>

  <template id="task-item-template">
    <li class="task-item" data-task-item>
      <div class="task-main">
        <input
          class="task-complete"
          data-action="toggle-complete"
          type="checkbox"
          aria-label="Mark task as completed"
        >
        <span class="task-title" data-task-title></span>
      </div>
      <div class="task-actions" aria-label="Task actions">
        <button class="task-action task-edit" data-action="edit" type="button" aria-label="Edit task">Edit</button>
        <button class="task-action task-delete" data-action="delete" type="button" aria-label="Delete task">Delete</button>
      </div>
    </li>
  </template>
</body>
</html>
